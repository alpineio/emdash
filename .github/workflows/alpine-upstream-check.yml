# Weekly check that mixcommand still rebases cleanly onto emdash-cms/emdash main
# and passes the package tests. Opens (or updates) an issue labelled
# upstream-sync when anything breaks, and closes it once a run passes again.
# It never pushes: syncing the branches stays a manual step.
#
# The release job opens an upstream-release issue when emdash-cms has a
# release tag newer than the one the latest @alpineio/emdash was built on.
# Alpine sites turn off EmDash's own npm update banner, so this is their notice.
name: Upstream sync check

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read

concurrency:
  group: upstream-sync-check
  cancel-in-progress: true

env:
  # Pins every gh command to this fork. Without it gh picks the "upstream"
  # remote the jobs add, and would file issues on emdash-cms/emdash.
  GH_REPO: ${{ github.repository }}
  BRANCH: mixcommand
  UPSTREAM: https://github.com/emdash-cms/emdash
  LABEL: upstream-sync

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          registry-url: https://npm.pkg.github.com
          scope: "@alpineio"

      - name: Compare the newest upstream release with the latest Alpine build
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABEL: upstream-release
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --tags upstream
          tag=$(git tag -l 'emdash@*' --sort=-v:refname | grep -E '^emdash@[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          upstream="${tag#emdash@}"
          published=$(npm view @alpineio/emdash versions --json --registry https://npm.pkg.github.com 2>/dev/null || true)
          base=$(node scripts/alpine-release.mjs latest-base "$published")
          if [ -z "$base" ]; then
            echo "Could not read published @alpineio/emdash versions; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$base" "$upstream" | sort -V | tail -1)
          if [ "$newest" = "$base" ]; then
            echo "Latest Alpine build is on emdash $base, the newest upstream release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="emdash $upstream is out: run Alpine release"
          if gh issue list --label "$RELEASE_LABEL" --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists: $title" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create "$RELEASE_LABEL" --color 1D76DB --description "Upstream EmDash release to build" --force
          {
            echo "Upstream released [emdash $upstream]($UPSTREAM/releases/tag/emdash%40$upstream). The latest @alpineio/emdash is built on $base."
            echo
            echo "To build on it: Actions → Alpine release → Run workflow, with Publish on. Then move each site to the new version, test first."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --label "$RELEASE_LABEL" --body-file "$RUNNER_TEMP/issue.md"
          echo "Opened: $title" >> "$GITHUB_STEP_SUMMARY"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      # pnpm is needed during the rebase to regenerate a conflicted lockfile.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Rebase onto upstream main
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if ! bash scripts/alpine-rebase.sh upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git rebase --abort
            exit 1
          fi
          echo "Rebased $BRANCH onto upstream/main ($behind new upstream commits)." >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: pnpm build

      - name: Install Playwright Chromium
        id: playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        id: test
        run: |
          set -o pipefail
          status=0
          pnpm --no-bail run --filter './packages/*' --filter '!@emdash-cms/admin' test 2>&1 | tee "$RUNNER_TEMP/test.log" || status=1
          # The admin's browser tests lose their test iframe when they share the
          # runner with the other suites, so they run on their own, as in upstream CI.
          pnpm run --filter @emdash-cms/admin test 2>&1 | tee -a "$RUNNER_TEMP/test.log" || status=1
          exit $status

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEHIND: ${{ steps.rebase.outputs.behind }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
          REBASE: ${{ steps.rebase.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The weekly upstream check for \`$BRANCH\` failed against upstream \`$UPSTREAM_SHA\` ($BEHIND new upstream commits)."
            echo
            echo "Run: $RUN_URL"
            echo
            if [ "$REBASE" = "failure" ]; then
              echo "**The rebase hit conflicts** in:"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt" 2>/dev/null
              echo
              echo "Resolve locally: \`git fetch upstream && git checkout $BRANCH && scripts/alpine-rebase.sh\`."
            elif [ "$INSTALL" = "failure" ]; then
              echo "**The rebase was clean, but \`pnpm install\` failed.** See the run log."
            elif [ "$BUILD" = "failure" ]; then
              echo "**The rebase was clean, but \`pnpm build\` failed.** See the run log."
            elif [ "$TEST" = "failure" ]; then
              echo "**The rebase was clean, but tests failed.** Failing lines:"
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test.log" | grep -E 'FAIL |✗|×|Test Files .*failed|Tests .*failed|ERR_PNPM' | head -60
              echo '```'
            else
              echo "**The check failed before the tests ran.** See the run log."
            fi
          } > "$body"

          gh label create "$LABEL" --color D93F0B --description "Weekly upstream sync check" --force
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "Upstream sync check failed for $BRANCH" --label "$LABEL" --body-file "$body"
          fi

      - name: Close resolved issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Passing again: $RUN_URL"
          fi

# Weekly check that mixcommand still rebases cleanly onto emdash-cms/emdash main
# and passes the package tests. Opens (or updates) an issue labelled
# upstream-sync when anything breaks, and closes it once a run passes again.
# It never pushes: syncing the branches stays a manual step.
#
# The release job opens an upstream-release issue when emdash-cms has a
# release tag newer than the one the latest @alpineio/emdash was built on.
# Alpine sites turn off EmDash's own npm update banner, so this is their notice.
name: Upstream sync check

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read

concurrency:
  group: upstream-sync-check
  cancel-in-progress: true

env:
  # Pins every gh command to this fork. Without it gh picks the "upstream"
  # remote the jobs add, and would file issues on emdash-cms/emdash.
  GH_REPO: ${{ github.repository }}
  BRANCH: mixcommand
  UPSTREAM: https://github.com/emdash-cms/emdash
  LABEL: upstream-sync

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          registry-url: https://npm.pkg.github.com
          scope: "@alpineio"

      - name: Compare the newest upstream release with the latest Alpine build
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABEL: upstream-release
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --tags upstream
          tag=$(git tag -l 'emdash@*' --sort=-v:refname | grep -E '^emdash@[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          upstream="${tag#emdash@}"
          published=$(npm view @alpineio/emdash versions --json --registry https://npm.pkg.github.com 2>/dev/null || true)
          base=$(node scripts/alpine-release.mjs latest-base "$published")
          if [ -z "$base" ]; then
            echo "Could not read published @alpineio/emdash versions; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$base" "$upstream" | sort -V | tail -1)
          if [ "$newest" = "$base" ]; then
            echo "Latest Alpine build is on emdash $base, the newest upstream release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="emdash $upstream is out: run Alpine release"
          if gh issue list --label "$RELEASE_LABEL" --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists: $title" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create "$RELEASE_LABEL" --color 1D76DB --description "Upstream EmDash release to build" --force
          {
            echo "Upstream released [emdash $upstream]($UPSTREAM/releases/tag/emdash%40$upstream). The latest @alpineio/emdash is built on $base."
            echo
            echo "To build on it: Actions → Alpine release → Run workflow, with Publish on. Then move each site to the new version, test first."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --label "$RELEASE_LABEL" --body-file "$RUNNER_TEMP/issue.md"
          echo "Opened: $title" >> "$GITHUB_STEP_SUMMARY"

  # Package tests, without the admin's browser tests (the browser job below).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      # pnpm is needed during the rebase to regenerate a conflicted lockfile.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Rebase onto upstream main
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if ! bash scripts/alpine-rebase.sh upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git rebase --abort
            exit 1
          fi
          echo "Rebased $BRANCH onto upstream/main ($behind new upstream commits)." >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        id: test
        run: |
          set -o pipefail
          # One package at a time: in parallel, plugin-test read its test
          # manifest while another suite was rewriting it.
          pnpm --no-bail --workspace-concurrency=1 run --filter './packages/*' --filter '!@emdash-cms/admin' test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: package tests
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEHIND: ${{ steps.rebase.outputs.behind }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
          REBASE: ${{ steps.rebase.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: bash scripts/alpine-check-report.sh

  # The admin's browser tests in a job of their own, as upstream CI runs them.
  # After the other suites on the same runner, a different file lost its test
  # iframe each week.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22 # the latest 22.x, as upstream's Browser Tests job uses
          cache: pnpm

      - name: Rebase onto upstream main
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if ! bash scripts/alpine-rebase.sh upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git rebase --abort
            exit 1
          fi

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build the admin and its dependencies
        id: build
        run: pnpm run --if-present --filter "@emdash-cms/admin..." build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the admin in Chromium
        id: test
        run: |
          set -o pipefail
          pnpm run --filter @emdash-cms/admin test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: admin browser tests
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEHIND: ${{ steps.rebase.outputs.behind }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
          REBASE: ${{ steps.rebase.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: bash scripts/alpine-check-report.sh

  resolved:
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the open issue once every job passes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Passing again: $RUN_URL"
          fi

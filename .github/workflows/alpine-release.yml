# Builds Alpine's EmDash from an upstream release tag plus the Alpine commits
# on mixcommand, tests it, and publishes @alpineio/emdash,
# @alpineio/emdash-cloudflare and @alpineio/emdash-basics to GitHub Packages
# (version scheme: scripts/alpine-release.mjs). Without "publish" it stops
# after packing and uploads the tarballs as an artifact.
name: Alpine release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to build on (blank = latest emdash@x.y.z)"
        required: false
        default: ""
      publish:
        description: "Publish to GitHub Packages (off = dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: alpine-release
  cancel-in-progress: false

env:
  BRANCH: mixcommand
  UPSTREAM: https://github.com/emdash-cms/emdash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@alpineio"

      - name: Rebase Alpine commits onto the upstream release
        id: base
        env:
          INPUT_TAG: ${{ inputs.upstream_tag }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --tags upstream main
          tag="${INPUT_TAG:-$(git tag -l 'emdash@*' --sort=-v:refname | grep -E '^emdash@[0-9]+\.[0-9]+\.[0-9]+$' | head -1)}"
          git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || { echo "No tag $tag" >&2; exit 1; }
          published=$(npm view @alpineio/emdash versions --json --registry https://npm.pkg.github.com 2>/dev/null || true)
          version=$(node scripts/alpine-release.mjs next-version "${tag#emdash@}" "$published")
          bash scripts/alpine-rebase.sh --onto "$tag" "$(git merge-base HEAD upstream/main)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### $version"
            echo "Built on upstream \`$tag\` with these Alpine commits:"
            echo
            git log --format='- %h %s' "$tag..HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

      # Before the build, because core bakes its version into dist/, and
      # before the install, because pnpm refuses to run scripts in a workspace
      # whose package.json files changed since the last install.
      - name: Set version
        run: node scripts/alpine-release.mjs set-version "${{ steps.base.outputs.version }}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Test the packages being published
        run: pnpm --no-bail --filter emdash --filter @emdash-cms/cloudflare --filter @alpineio/emdash-basics test

      - name: Pack
        run: node scripts/alpine-release.mjs pack "${{ steps.base.outputs.version }}" "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-emdash-${{ steps.base.outputs.version }}
          path: ${{ runner.temp }}/tarballs/*.tgz

      - name: Publish
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/tarballs"
          # Core first: the Cloudflare adapter depends on it.
          for name in alpineio-emdash-[0-9]*.tgz alpineio-emdash-cloudflare-*.tgz alpineio-emdash-basics-*.tgz; do
            npm publish "$name" --registry https://npm.pkg.github.com
          done
          echo "Published to GitHub Packages." >> "$GITHUB_STEP_SUMMARY"
